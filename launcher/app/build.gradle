plugins {
    id 'com.android.application'
}

// When .cursor-rebuild/ parts are present, materialize AppAdapter.java and MainActivity.java before compile.
tasks.register('rebuildTvHomeSources') {
    def rebuildDir = rootProject.file('../.cursor-rebuild')
    onlyIf { file("${rebuildDir}/AppAdapter.java.part0").exists() }
    doLast {
        def adapterOut = file('src/main/java/com/gathin/tvhome/AppAdapter.java')
        def parts = (0..3).collect { file("${rebuildDir}/AppAdapter.java.part${it}") }
        parts.each { f -> assert f.exists() : "missing ${f}" }
        def out = new ByteArrayOutputStream()
        parts.each { out.write(it.bytes) }
        adapterOut.bytes = out.toByteArray()
        assert adapterOut.length() == 53994 : "AppAdapter size ${adapterOut.length()}"
        exec {
            commandLine 'python3', '-c',
                "import hashlib,sys;c=open(sys.argv[1],'rb').read();b=hashlib.sha1(b'blob %d\\0'%len(c)+c).hexdigest();print(len(c),b);assert b=='37354e4633c2d3850130fd1f256f7963c0acffea'",
                adapterOut.absolutePath
        }
        def patch = file("${rebuildDir}/MainActivity.patch")
        assert patch.exists()
        exec {
            workingDir rootProject.projectDir.parentFile
            commandLine 'git', 'apply', '--verbose', patch.absolutePath
        }
        def mainOut = file('src/main/java/com/gathin/tvhome/MainActivity.java')
        exec {
            commandLine 'python3', '-c',
                "import hashlib,sys;c=open(sys.argv[1],'rb').read();b=hashlib.sha1(b'blob %d\\0'%len(c)+c).hexdigest();print(len(c),b);assert b=='1bc1254a4c86623903ebb3e38dfdad6f51be10cf'",
                mainOut.absolutePath
        }
    }
}
tasks.named('preBuild').configure { dependsOn('rebuildTvHomeSources') }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '3.2'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
